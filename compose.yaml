name: fantasy-analytics

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fantasy}:${POSTGRES_PASSWORD:-fantasy}@postgres:5432/${POSTGRES_DB:-fantasy}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fantasy}
      POSTGRES_USER: ${POSTGRES_USER:-fantasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantasy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-url
    entrypoint: ["fantasy-migrate"]
    command: ["upgrade"]
    restart: "no"

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-url
    command:
      - --output
      - /app/data/${DISCOVERY_DIRECTORY:-discovery}
      - --tournament
      - ${FANTASY_TOURNAMENT:-russia}
    volumes:
      - ./data:/app/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-url
      NIGHTLY_REFRESH_ENABLED: ${NIGHTLY_REFRESH_ENABLED:-true}
      NIGHTLY_REFRESH_HOUR: ${NIGHTLY_REFRESH_HOUR:-3}
      NIGHTLY_REFRESH_MINUTE: ${NIGHTLY_REFRESH_MINUTE:-0}
      NIGHTLY_REFRESH_TZ: ${NIGHTLY_REFRESH_TZ:-Europe/Moscow}
      NIGHTLY_REFRESH_CATCHUP_HOURS: ${NIGHTLY_REFRESH_CATCHUP_HOURS:-3}
    entrypoint: ["python3", "-m", "fantasy_analytics.api"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
