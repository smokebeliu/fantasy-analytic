# Alembic configuration for Fantasy Analytics.
#
# The migration scripts are packaged inside the application so they can be
# applied both from a source checkout and from the installed distribution.
# The database URL is taken from the DATABASE_URL environment variable by
# env.py, so it is intentionally left blank here.

[alembic]
script_location = src/fantasy_analytics/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
