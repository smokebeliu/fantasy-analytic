[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-analytics"
version = "0.1.0"
description = "Sports.ru Fantasy RPL data discovery prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fantasy-discover = "fantasy_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
